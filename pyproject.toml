[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ojt-risk"
version = "0.1.0"
description = "Rule-based OJT eligibility, class recommendations and conditional forecasts"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ojt-risk = "ojt_risk.__main__:main"

[tool.setuptools.packages.find]
include = ["ojt_risk*"]
